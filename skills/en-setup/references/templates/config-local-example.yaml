# Per-developer per-repo Ensemble configuration.
# Copy to .ensemble/config.local.yaml (gitignored) and edit for your preferences.
#
# Two files, two readers. Skills that read config through ensemble-config-get
# (the review keys below) layer this file over ~/.ensemble/config.json. Host
# detection reads ~/.ensemble/config.json ONLY, so the peer keys under
# "Cross-review behavior" belong there, not here; they are listed for discovery.

# --- Cross-review behavior (read from ~/.ensemble/config.json by host detection) ---

# How peer cross-review is performed. One of:
#   auto                 - use cross-agent if both CLIs are installed; else fall back to single-agent
#   cross-agent-only     - require cross-agent; fail (don't fall back) if other CLI not installed
#   single-agent-only    - always use single-agent fallback even if both CLIs are installed
#   off                  - disable cross-review across all skills
# peer_mode_override: auto

# Hard timeout per peer-review subprocess (the read-tree access mode defaults to 1200).
# peer_timeout_seconds: 600

# Skip peer review on artifacts smaller than this (line count).
# skip_peer_below_lines: 50

# Skip peer review on Lightweight depth.
# skip_peer_on_lightweight: true

# --- en-ship watch loop ---

# How many REPAIR cycles the post-PR watch loop may run before escalating the
# remaining findings as needs-human. A cycle is a fix-and-push iteration, not a
# status poll: waiting on unchanged CI costs nothing, so a long test job cannot
# exhaust the budget by being slow. /en-flow documents the same default.
# ship:
#   watch_max_cycles: 2

# --- en-qa ---

# Browser QA is the expensive part of a run. The per-flow cap asks a person to
# continue or skip and gives a caller a Skip; the bug cap fixes the first N and
# lists the rest. Test accounts reference env vars, never the secret itself.
# qa:
#   browser_flow_timeout_minutes: 15
#   max_bugs_to_fix_per_run: 5
#   test_accounts:
#     primary:
#       email: qa-primary@example.com
#       password: $QA_PRIMARY_PASSWORD

# --- Build behavior ---

# Default branch (used when the repo doesn't have a clear default).
default_branch_fallback: main

# --- en-build standing policy ---
# These are project preferences rather than per-run choices, so they live here
# instead of as flags. Anything that changes run to run — which units to build,
# where to resume, whether to skip a gate this once — stays a flag.
# build:
#   worktree: false              # run every build in ../<repo>-<plan_id>/
#   strict_destructive: false    # extend the typed confirmation to risk: high and P3
#   pause_between_phases: false  # prompt between phases instead of auto-rolling
#   learning_checkpoint: true    # run the structured learning checkpoint at step 10.6

# --- Lint ---

# lint:
#   freshness_target_days: 30
#   scope_default: docs/
#   fix_skip_rules: []

# --- Review (layered over ~/.ensemble/config.json via ensemble-config-get) ---

# Confidence gate for /en-review. Findings rated below this threshold are
# filtered out of the surfaced output and filed as TD entries in
# docs/plans/tech-debt-tracker.md (with marker "Filed by /en-review").
# Range 1-10. Default 7. P0 findings always surface regardless.
# review:
#   confidence_threshold: 7

# Reviewer models and effort (flat keys; read by /en-review through
# ensemble-config-get, this file first, then ~/.ensemble/config.json).
# Aliases (sonnet, opus, haiku, fable) or a full model ID; your file, your value.
# review_peer_model_alias: sonnet        # Claude peer; ignored when the peer is Codex
# review_peer_codex_model:               # Codex peer `-m`; unset inherits ~/.codex/config.toml
# review_peer_effort_override:           # low | medium | high | xhigh; unset lets the ladder decide
# review_host_model_alias:               # every host persona under --cross / --host; unset uses the agent frontmatter
# Host persona effort is the dimension-reviewer agent's `effort:` frontmatter
# (high); override per repo with a copy at .claude/agents/dimension-reviewer.md.
# The scheduled sweep's model and effort are `sweep.model` / `sweep.effort`
# below, read from this file in the checkout on the sweep machine.

# --- Observability (telemetry harness) ---

# Where /en-debug looks for application logs when reproducing a bug.
# Supports literal paths, gh-action artifact names, or a shell snippet that
# emits log lines on stdout. See references/observability-conventions.md.
# observability:
#   log_source: stdout                   # one of: stdout | file | command
#   log_path: ./logs/app.jsonl           # used when log_source: file
#   log_command: 'docker logs app'       # used when log_source: command
#   allowed_log_commands: []             # extends the default allowlist (docker, kubectl, journalctl, gh run view, datadog-cli, aws logs, gcloud logging)
#   max_log_lines: 5000                  # cap on fetched lines per run

# --- Sweep ---

# sweep:
#   # The sweep runs on a dedicated machine on a launchd schedule through Codex
#   # (D101); `schedule` here is informational, the cadence lives in that
#   # machine's plist (install-sweep-schedule install --cadence ...).
#   schedule: weekly                     # daily | weekly | monthly
#   enabled: true                        # false: the runner skips this repo; /en-setup records it on a decline
#   # Model and effort for the scheduled run, read from THIS file in the
#   # checkout on the sweep machine. Unset falls back to the plist's
#   # ENSEMBLE_SWEEP_MODEL / ENSEMBLE_SWEEP_EFFORT, then Codex's default.
#   model: fable                         # codex exec -m; alias or full model ID
#   effort: high                         # minimal | low | medium | high | xhigh
#   auto_merge_enabled: true             # false: every sweep PR is recorded as not merge-eligible and stays open
#   # Timeouts are the runner's: ENSEMBLE_SWEEP_TIMEOUT (per-repo Codex cap) and
#   # ENSEMBLE_SWEEP_CHECKS_TIMEOUT (wait for a PR's checks), set in the plist.
#   max_prs_per_run: 6
#   # Dead-code + dep-vuln continuous monitoring.
#   continuous_monitoring:
#     dead_code: true
#     dep_audit: true
#   # Triage threshold: findings under <auto_plan_threshold_loc> lines of fix
#   # AND fewer than <auto_plan_threshold_locations> affected files file as TD;
#   # findings beyond either threshold open a draft plan in docs/plans/active/.
#   auto_plan_threshold_loc: 50
#   auto_plan_threshold_locations: 2
#   max_drafts_per_run: 3

# --- Plan branching ---

# Future extension (not yet implemented in /en-plan or /en-foundation):
# Extend the default-branch auto-branch checkpoint to additional long-lived
# integration branches (gitflow develop, release branches, etc.). When set,
# any branch in this list triggers the SAME prompt as the default branch.
# In v1, /en-plan's default-branch checkpoint fires ONLY on the repo's literal
# default branch. Documented so the extension point is discoverable.
#
# protected_branches:
#   - develop
#   - trunk
#   - release/*  # glob patterns will be supported
