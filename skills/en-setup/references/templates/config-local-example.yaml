# Per-developer per-repo Ensemble configuration.
# Copy to .ensemble/config.local.yaml (gitignored) and edit for your preferences.
# Repo-level overrides take precedence over the global ~/.ensemble/config.json.

# --- Cross-review behavior ---

# How peer cross-review is performed. One of:
#   auto                 - use cross-agent if both CLIs are installed; else fall back to single-agent
#   cross-agent-only     - require cross-agent; fail (don't fall back) if other CLI not installed
#   single-agent-only    - always use single-agent fallback even if both CLIs are installed
#   off                  - disable cross-review across all skills
peer_mode_override: auto

# Models the peer subprocess uses (passed to the peer CLI; verify these are valid in your install).
# These are config defaults — see references/cli-wrappers.md.
# peer_model_codex: gpt-5-codex-mini
# peer_model_claude: claude-sonnet-4-6

# What to do when peer review returns verdict: reject.
#   pause - pause and ask the user (default)
#   apply - apply findings the host agrees with anyway, surface the rejection in the progress report
peer_reject_behavior: pause

# Hard timeout per peer-review subprocess.
peer_timeout_seconds: 600

# Skip peer review on artifacts smaller than this (line count).
skip_peer_below_lines: 50

# Skip peer review on Lightweight depth.
skip_peer_on_lightweight: true

# --- en-ship watch loop ---

# How many REPAIR cycles the post-PR watch loop may run before escalating the
# remaining findings as needs-human. A cycle is a fix-and-push iteration, not a
# status poll: waiting on unchanged CI costs nothing, so a long test job cannot
# exhaust the budget by being slow. /en-flow documents the same default.
# ship:
#   watch_max_cycles: 2

# --- Build behavior ---

# Default branch (used when the repo doesn't have a clear default).
default_branch_fallback: main

# Whether the code-simplifier agent runs per unit during en-build.
# simplifier:
#   enabled_default: true
#   skip_on_trivial: true
#   max_lines_to_run: 2000

# --- en-build standing policy ---
# These are project preferences rather than per-run choices, so they live here
# instead of as flags. Anything that changes run to run — which units to build,
# where to resume, whether to skip a gate this once — stays a flag.
# build:
#   worktree: false              # run every build in ../<repo>-<plan_id>/
#   strict_destructive: false    # extend the typed confirmation to risk: high and P3
#   pause_between_phases: false  # prompt between phases instead of auto-rolling
#   learning_checkpoint: true    # run the structured learning checkpoint at step 10.6

# --- Learnings ---

# Whether to share learnings across projects (default: false; per-project store).
learnings_cross_project: false

# Off-topic threshold for `/en-learn ingest` (0–1; LLM-judged relevance against foundation.md).
# Below this, the source is silently skipped unless --force.
# learn_ingest_off_topic_threshold: 0.3

# --- Lint ---

# lint:
#   freshness_target_days: 30
#   scope_default: docs/
#   fix_skip_rules: []

# --- Review ---

# Confidence gate for /en-review. Findings rated below this threshold are
# filtered out of the surfaced output and filed as TD entries in
# docs/plans/tech-debt-tracker.md (with marker "Filed by /en-review").
# Range 1-10. Default 7. P0 findings always surface regardless.
# review:
#   confidence_threshold: 7

# --- Observability (telemetry harness) ---

# Where /en-debug looks for application logs when reproducing a bug.
# Supports literal paths, gh-action artifact names, or a shell snippet that
# emits log lines on stdout. See references/observability-conventions.md.
# observability:
#   log_source: stdout                   # one of: stdout | file | command
#   log_path: ./logs/app.jsonl           # used when log_source: file
#   log_command: 'docker logs app'       # used when log_source: command
#   structured_logging_required: true    # if true, ensemble-lint flags console.log/print
#   logging_dev_paths:                   # paths exempt from the logging.unstructured rule
#     - "**/*.dev.{ts,js}"
#     - "scripts/**"
#     - "tests/**"

# --- Architecture fitness ---

# When present and bin/check-fitness exists in the repo root, ensemble-lint
# invokes it to check architectural rules (layer boundaries, dependency
# direction, etc.). Contract documented in references/architecture-fitness.md.
# fitness:
#   enabled: true
#   check_command: bin/check-fitness     # default; override if your project uses a different name

# --- Sweep ---

# sweep:
#   # Cadence — substituted into .github/workflows/en-sweep.yml at /en-setup
#   # install time. Named values (`daily`/`weekly`/`monthly`) map to canonical
#   # cron expressions; any other value is treated as a literal cron passthrough.
#   # Default `weekly` (Monday 9am UTC). Edit the workflow file directly to
#   # tweak after install — re-running /en-setup respects the schedule already
#   # in the workflow unless you explicitly opt to regenerate.
#   schedule: weekly                     # daily | weekly | monthly | <cron expression>
#   ci_timeout_minutes: 30
#   max_prs_per_run: 6
#   # Dead-code + dep-vuln continuous monitoring.
#   continuous_monitoring:
#     dead_code: true
#     dep_audit: true
#   # Triage threshold: findings under <auto_plan_threshold_loc> lines of fix
#   # AND fewer than <auto_plan_threshold_locations> affected files file as TD;
#   # findings beyond either threshold open a draft plan in docs/plans/active/.
#   auto_plan_threshold_loc: 50
#   auto_plan_threshold_locations: 2
#   max_drafts_per_run: 3

# --- Plan branching ---

# Future enhancement (not yet implemented in /en-plan or /en-foundation):
# Extend the default-branch auto-branch checkpoint to additional long-lived
# integration branches (gitflow develop, release branches, etc.). When set,
# any branch in this list triggers the SAME prompt as the default branch.
#
# In v1, /en-plan's default-branch checkpoint fires ONLY on the repo's literal
# default branch (per three-source detection: gh defaultBranchRef → git
# symbolic-ref refs/remotes/origin/HEAD → hardcoded fallback). This config
# extension is documented so the extension point is discoverable.
#
# protected_branches:
#   - develop
#   - trunk
#   - release/*  # glob patterns will be supported
