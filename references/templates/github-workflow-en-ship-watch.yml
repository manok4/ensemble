# Installed by /en-setup at .github/workflows/en-ship-watch.yml
#
# CI-hosted self-heal for hands-off /en-ship (EN04). Event-driven: fires when one
# of the repo's CI workflows completes with a `failure` conclusion (workflow_run).
#
# SECURITY (workflow_run runs privileged — write perms + secrets):
#   * This job checks out the TRUSTED default-branch code, NOT the PR head. The
#     wrapper (bin/en-ship-watch-ci from the default branch) then rejects fork /
#     cross-repository PRs via the GitHub API BEFORE fetching or running any PR
#     branch — so untrusted fork code never executes here. Only same-repo PR
#     branches (written by trusted collaborators) are fetched and fixed.
#   * Do NOT change this to check out ${{ github.event.workflow_run.head_sha }}
#     and run PR-head scripts — that reintroduces the pwn-request vulnerability.
#
# `{{CI_WORKFLOW_NAMES}}` is substituted by /en-setup with the repo's CI workflow
# name(s) (default "CI"). workflow_run only fires for those workflows, so the
# watcher never reacts to its OWN completion (no self-trigger loop).
#
# TOKEN: a fix push with the default GITHUB_TOKEN does NOT retrigger Actions CI.
# The self-heal loop needs a workflow-triggering token — a PAT/App token in the
# EN_SHIP_WATCH_TOKEN secret, used for checkout + push. Without it the wrapper
# escalates rather than pushing a fix CI would silently ignore.
#
# Fix-agent auth reuses en-sweep's secrets (CLAUDE_CODE_OAUTH_TOKEN /
# ANTHROPIC_API_KEY / OPENAI_API_KEY). EN_SHIP_WATCH_TOKEN is the ONE new secret.

name: en-ship-watch

on:
  workflow_run:
    workflows: [{{CI_WORKFLOW_NAMES}}]   # substituted by /en-setup; default ["CI"]
    types: [completed]

permissions:
  contents: write        # to push branch-only fix commits
  pull-requests: write   # to read PR state, edit labels, comment
  checks: read

concurrency:
  group: en-ship-watch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  self-heal:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # TRUSTED checkout: the repo's default branch, NOT the PR head. The wrapper
      # run below is the default-branch copy; it gates forks out via the API
      # before ever fetching PR code. See the SECURITY note above.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.EN_SHIP_WATCH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install agent CLI
        run: |
          # Real install of the coding-agent CLI the fix agent drives. Default is
          # the Claude CLI; switch to your codex install if that's your agent.
          if ! command -v claude >/dev/null 2>&1 && ! command -v codex >/dev/null 2>&1; then
            npm install -g @anthropic-ai/claude-code
          fi
          # If install failed, the wrapper (not this step) drops the label and
          # comments an escalation, so the PR never sits silently armed.

      - name: Run en-ship-watch self-heal
        env:
          # Fix-agent auth — shared with en-sweep (whichever CLI is on PATH picks up its var).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Workflow-triggering token for gh + git push (so the fix retriggers CI).
          GITHUB_TOKEN: ${{ secrets.EN_SHIP_WATCH_TOKEN || secrets.GITHUB_TOKEN }}
          EN_SHIP_WATCH_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EN_SHIP_WATCH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # Whether a real workflow-triggering token is present; when false the
          # wrapper escalates instead of pushing a fix CI won't rerun.
          EN_SHIP_WATCH_HAS_TRIGGER_TOKEN: ${{ secrets.EN_SHIP_WATCH_TOKEN != '' }}
        run: |
          # Run the TRUSTED default-branch wrapper. Do NOT swap this for a PR-head
          # copy — that would run untrusted code with these secrets.
          bin/en-ship-watch-ci
