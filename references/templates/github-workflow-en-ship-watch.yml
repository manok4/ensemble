# Installed by /en-setup at .github/workflows/en-ship-watch.yml
#
# CI-hosted self-heal for hands-off /en-ship (EN04). Event-driven: fires when a
# check_suite completes with a `failure` conclusion. The job only acts on open
# PRs carrying the `en-ship-watch` label (applied by /en-ship when it arms the
# watcher); everything else is a fast no-op inside the wrapper. On a labeled PR
# it drives /en-resolve-pr headless to fix the failing CI, bounded to 3 attempts,
# pushes the fix BRANCH-ONLY, and escalates (drops the label + comments) when it
# can't safely proceed. GitHub Actions is the daemon — nothing runs locally.
#
# Auth reuses en-sweep's secrets (no new secret): CLAUDE_CODE_OAUTH_TOKEN or
# ANTHROPIC_API_KEY (claude), OPENAI_API_KEY (codex), plus GITHUB_TOKEN.

name: en-ship-watch

on:
  check_suite:
    types: [completed]

permissions:
  contents: write        # to push branch-only fix commits
  pull-requests: write   # to read PR state, edit labels, comment
  checks: read

concurrency:
  # One self-heal at a time per head SHA; a newer failure supersedes an older run.
  group: en-ship-watch-${{ github.event.check_suite.head_sha }}
  cancel-in-progress: false

jobs:
  self-heal:
    # Only failed check suites; the wrapper further gates on the en-ship-watch label.
    if: github.event.check_suite.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                                   # full history for the attempt-count trailer scan
          ref: ${{ github.event.check_suite.head_sha }}

      - name: Set up Bun and tools
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Resolve CLI
        run: |
          if ! command -v claude >/dev/null 2>&1 && ! command -v codex >/dev/null 2>&1; then
            echo "ERROR: en-ship-watch requires claude or codex CLI in the runner. See docs/foundation.md D38."
            exit 1
          fi

      - name: Run en-ship-watch self-heal
        env:
          # Subscription auth (Pro/Max), preferred when available.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-key fallbacks — whichever CLI is on PATH picks up the matching var.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EN_SHIP_WATCH_HEAD_SHA: ${{ github.event.check_suite.head_sha }}
          EN_SHIP_WATCH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Run via the CI wrapper from the freshly-cloned plugin (NOT the
          # project-local bin/ copy) so wrapper fixes propagate with each run;
          # fall back to the project-local copy for older installs.
          if [ -x "$ENSEMBLE_PLUGIN_DIR/bin/en-ship-watch-ci" ]; then
            "$ENSEMBLE_PLUGIN_DIR/bin/en-ship-watch-ci"
          else
            bin/en-ship-watch-ci
          fi
