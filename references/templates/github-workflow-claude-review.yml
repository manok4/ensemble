# Anthropic Claude Code Review GitHub Action (v1).
# Runs Claude on every PR and posts inline review comments. Pairs with
# /en-resolve-pr (which handles the comments locally afterward).
#
# v1 changes from v0.x:
#   - `claude_code_oauth_token` is the dedicated input for OAuth (Pro/Max).
#     `anthropic_api_key` remains for direct-API auth — they are distinct inputs.
#   - `mode: review` was removed. Mode is auto-detected; PR-review automation
#     is driven by the `prompt:` input that includes REPO + PR NUMBER context.
#
# Setup steps for users:
#   1. Generate the OAuth token locally:    claude setup-token
#   2. Repo Settings → Secrets and variables → Actions → New repository secret
#         Name:  CLAUDE_CODE_OAUTH_TOKEN
#         Value: <token from step 1>
#   3. Commit this file. The action runs on the next PR open or push.
#
# To switch to API-key auth: replace `claude_code_oauth_token` with
# `anthropic_api_key` and use a secret named `ANTHROPIC_API_KEY`.
#
# See docs/integrations/anthropic-code-review-action.md for the full guide,
# trade-offs (rate limits vs. API cost), and ToS notes.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    # Skip drafts to reduce rate-limit burn — only review when ready-for-review.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write   # post inline review comments
      id-token: write        # OIDC token for claude-code-action@v1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the action sees the diff context

      - uses: anthropics/claude-code-action@v1
        with:
          # OAuth (Pro/Max subscription) — default.
          # Switch to `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` for API-key auth.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # v1 uses prompt-based automation. Mode is auto-detected from context.
          # The REPO + PR NUMBER lines are required so the action knows what to review.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
              - Correctness and bugs
              - Security vulnerabilities
              - Test coverage gaps
              - Performance regressions
              - Adherence to project conventions in CLAUDE.md and AGENTS.md
              - Adherence to filed learnings under docs/learnings/patterns/

            Aim for high-precision findings. Three important comments are more
            useful than fifteen nits — but do flag clear bugs and security issues
            no matter how small.

            Post inline review comments at the relevant file:line. Group related
            findings under a single comment when they share a root cause.

          # Track progress in a sticky comment so reviewers can see the action is running.
          track_progress: true
