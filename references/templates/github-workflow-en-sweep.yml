# Installed by /en-setup at .github/workflows/en-sweep.yml
# Triggers en-sweep on every push to main (i.e., immediately after a PR merges).
# Sweep is strictly doc-only and auto-merges its own PRs after en-review clears them.

name: en-sweep

on:
  push:
    branches: [main]

permissions:
  contents: write       # to commit doc-only fixes
  pull-requests: write  # to open and auto-merge PRs
  issues: write         # to post comments on the source PR

concurrency:
  group: en-sweep-${{ github.ref }}
  cancel-in-progress: false

env:
  ENSEMBLE_SWEEP_DEPTH: 0

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Loop guard 1: skip sweep-authored commits
      # Commit metadata is passed via env (NOT inlined) — single quotes or newlines
      # in author names / commit messages would otherwise break the bash parser
      # before any guard runs (squash-merge messages routinely contain both).
      - name: Skip sweep-authored commits
        id: skip-self
        env:
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_AUTHOR" = "ensemble-sweep[bot]" ] \
             || [[ "$COMMIT_MESSAGE" == "chore(en-sweep):"* ]] \
             || [[ "$COMMIT_MESSAGE" == "chore(arch):"* ]] \
             || [[ "$COMMIT_MESSAGE" == "chore(plans):"* ]] \
             || [[ "$COMMIT_MESSAGE" == "chore(learnings):"* ]] \
             || [[ "$COMMIT_MESSAGE" == "chore(maps):"* ]] \
             || [[ "$COMMIT_MESSAGE" == "chore(docs):"* ]]; then
            echo "Skipping: sweep-authored commit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.skip-self.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Loop guard 3: skip if the merge that just happened was a sweep-labeled PR
      - name: Skip sweep-labeled PR merges
        id: skip-label
        if: steps.skip-self.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PR_NUM=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -n "$PR_NUM" ]; then
            LABELS=$(gh pr view "$PR_NUM" --json labels -q '.labels[].name' 2>/dev/null || true)
            if echo "$LABELS" | grep -q '^en-sweep$'; then
              echo "Skipping: merge of an en-sweep-labeled PR"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Bun and tools
        if: steps.skip-self.outputs.skip == 'false' && steps.skip-label.outputs.skip == 'false'
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.skip-self.outputs.skip == 'false' && steps.skip-label.outputs.skip == 'false'
        run: |
          # CLI auth: the runner needs claude or codex CLI on PATH plus a matching
          # auth secret in repo Settings → Secrets and variables → Actions:
          #   - claude CLI: CLAUDE_CODE_OAUTH_TOKEN (Pro/Max subscription;
          #     generate via `claude setup-token`) OR ANTHROPIC_API_KEY (pay-per-use API)
          #   - codex CLI:  OPENAI_API_KEY
          # Provide whichever matches the CLI you install. Customize this step for
          # your install method.
          if ! command -v claude >/dev/null 2>&1 && ! command -v codex >/dev/null 2>&1; then
            echo "ERROR: en-sweep requires claude or codex CLI in the runner. See docs/foundation.md §5.2.10."
            exit 1
          fi

      - name: Run en-sweep
        if: steps.skip-self.outputs.skip == 'false' && steps.skip-label.outputs.skip == 'false'
        env:
          # Subscription auth (Pro/Max): preferred when available — claude CLI honors
          # this token and bills against the subscription's rate limit instead of
          # pay-per-use API tokens. Generate via `claude setup-token` and store as
          # CLAUDE_CODE_OAUTH_TOKEN in repo secrets.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-key auth fallbacks. Whichever CLI is on PATH picks up the matching
          # variable; the others can be empty/missing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENSEMBLE_SWEEP_DEPTH: ${{ env.ENSEMBLE_SWEEP_DEPTH }}
          EN_REVIEW_MODE: report-only
        run: |
          # Loop guard 5: hard cap on recursion depth
          if [ "${ENSEMBLE_SWEEP_DEPTH:-0}" -ge 1 ]; then
            echo "Sweep recursion depth cap reached. Skipping."
            exit 0
          fi
          export ENSEMBLE_SWEEP_DEPTH=$(( ${ENSEMBLE_SWEEP_DEPTH:-0} + 1 ))

          # Run sweep via the CI wrapper (resolves claude or codex headlessly)
          bin/en-sweep-ci

      - name: Post summary on source PR
        if: always() && steps.skip-self.outputs.skip == 'false' && steps.skip-label.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PR_NUM=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -n "$PR_NUM" ] && [ -f .ensemble/sweep-summary.md ]; then
            gh pr comment "$PR_NUM" --body-file .ensemble/sweep-summary.md || true
          fi
