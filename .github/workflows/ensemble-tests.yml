# Hermetic test runner. Does NOT interpolate any github.event.* fields into
# shell commands — no commit-message / PR-title / branch-name injection vectors.
# (See https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/
# for the pattern this workflow intentionally avoids.)

name: ensemble-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. plan-lifecycle-drift asks whether a plan's units have
          # already landed on the default branch, which the default depth-1
          # checkout cannot answer: with no history the matcher finds nothing,
          # and a check that can never match is indistinguishable from one
          # reporting no drift.
          fetch-depth: 0

      - name: Verify required tools
        run: |
          for cmd in bash jq git; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "ERROR: $cmd is required but not on PATH" >&2
              exit 1
            fi
            echo "  ✓ $cmd: $(command -v "$cmd")"
          done

      # On a PR, lint only the docs the PR changed (3s/file against 68s for the
      # tree) and run only the tests the change can break. On a push to main,
      # both run in full: main is the authoritative tree and nothing there is
      # worth approximating.
      #
      # The base SHA arrives through env:, never interpolated into the script.
      - name: Lint the changed docs (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          changed=$(git diff --name-only "$BASE_SHA"...HEAD -- 'docs/**' AGENTS.md CLAUDE.md)
          [ -n "$changed" ] || { echo "No doc changes."; exit 0; }
          rc=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            skills/en-setup/references/templates/ensemble-lint --scope "$f" || rc=1
          done <<EOF
          $changed
          EOF
          exit "$rc"

      - name: Lint docs/ in full (main)
        if: github.event_name != 'pull_request'
        run: skills/en-setup/references/templates/ensemble-lint --scope docs/

      # tests/select-for.sh escalates to the full suite by itself when the
      # change touches the harness or the selector, so this is not a way to
      # skip tests that matter.
      - name: Run the tests this change can break (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -u
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          [ -n "$changed" ] || { echo "Empty diff."; exit 0; }
          ./tests/select-for.sh $changed

      - name: Run the full test suite (main)
        if: github.event_name != 'pull_request'
        run: ./tests/run.sh

      - name: Smoke-test ./setup --verify-only
        run: ./setup --verify-only --quiet
